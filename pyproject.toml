[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-workbench"
version = "0.1.0"
description = "EDA Workbench — local-first guided EDA (M1 Technical Foundation)"
# Target runtime 3.12+ (ES-5.14); code stays 3.11-compatible for CI flexibility.
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# M1 slice uses stdlib csv/sqlite only. Parquet/Excel adapters (pyarrow/openpyxl)
# are added in M1-next; the snapshot port already isolates storage format.

[tool.setuptools]
py-modules = []
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
