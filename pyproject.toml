[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-workbench"
version = "0.1.0"
description = "EDA Workbench — local-first guided EDA (M1 Technical Foundation)"
# Target runtime 3.12+ (ES-5.14); floor is Python 3.11 (P4-3 / K8): requires-python,
# ruff target-version py311, and CI matrix 3.11/3.12 are aligned. No 3.9 shims remain.
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyarrow>=14",   # canonical Parquet snapshots (Doc04)
    "openpyxl>=3.1", # Excel import adapter (M1-next)
    "reportlab>=4.0", # PDF export renderer (backend/pdf_renderer.py)
]
# NOTE: dev floor is Python 3.11+ (P4-3); datetime.UTC (3.11+) is used directly.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools]
py-modules = []
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend"]

[tool.ruff]
target-version = "py311"
[tool.pyright]
include = ["backend/contracts.py", "backend/ipc.py"]
typeCheckingMode = "basic"
strict = ["backend/contracts.py"]
venvPath = "."
venv = ".venv"
